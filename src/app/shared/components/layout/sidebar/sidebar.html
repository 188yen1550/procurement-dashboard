<!-- 檔案用途：側邊導覽；active 狀態協助使用者辨認所在頁面，角色隱藏不等於後端權限。 -->
<aside class="sidebar" [class.is-open]="isOpen" aria-label="主要導覽">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◆</span>
    <div>
      <strong>選品決策</strong>
      <span>Procurement AI</span>
    </div>

    <button
      type="button"
      class="close-button"
      aria-label="關閉導覽選單"
      (click)="closeRequested.emit()"
    >
      ×
    </button>
  </div>

  <nav class="navigation" aria-label="後台功能">
    <p class="nav-label">工作區</p>

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeRequested.emit()"
    >
      <span class="nav-icon" aria-hidden="true">▦</span>
      儀表板
    </a>

    <a
      routerLink="/products"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeRequested.emit()"
    >
      <span class="nav-icon" aria-hidden="true">▤</span>
      品項管理
    </a>

    <a
      routerLink="/products/ai-suggestions"
      routerLinkActive="active"
      (click)="closeRequested.emit()"
    >
      <span class="nav-icon" aria-hidden="true">✦</span>
      AI 建議清單
    </a>

    <a routerLink="/group-buy" routerLinkActive="active" (click)="closeRequested.emit()">
      <span class="nav-icon" aria-hidden="true">📋</span>
      歷史銷售紀錄
    </a>

    @if (isManager) {
      <a routerLink="/review" routerLinkActive="active" (click)="closeRequested.emit()">
        <span class="nav-icon" aria-hidden="true">✓</span>
        選品審核
      </a>

      <p class="nav-label nav-label-spaced">管理</p>

      <a routerLink="/settings" routerLinkActive="active" (click)="closeRequested.emit()">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        系統設定
      </a>
    }
  </nav>

  @if (useMockData) {
    <div class="sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      Demo 模式 · 目前顯示示範資料
    </div>
  }
</aside>
