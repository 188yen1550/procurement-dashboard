<div class="login-container">

  <!-- 左側:品牌與科技感背景區 -->
  <div class="brand-panel">
    <div class="brand-content">
      <svg viewBox="0 0 100 100" class="logo-icon">
        <path d="M30 20 L70 20 L80 40 L40 40 Z" fill="currentColor"/>
        <path d="M20 45 L60 45 L70 65 L30 65 Z" fill="currentColor"/>
        <path d="M40 70 L80 70 L60 90 L20 90 Z" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- 右側:表單與操作區 -->
  <div class="form-panel">

    <!-- 主要登入卡片 -->
    <main class="login-card-wrapper">
      <div class="login-card">

        <div class="card-header">
          <svg viewBox="0 0 100 100" class="logo-icon-small">
            <path d="M30 20 L70 20 L80 40 L40 40 Z" fill="currentColor"/>
            <path d="M20 45 L60 45 L70 65 L30 65 Z" fill="currentColor"/>
          </svg>
          <h1 class="card-title">企業系統登入</h1>
          <p class="card-subtitle">歡迎使用企業決策系統</p>
        </div>

        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" formControlName="username" placeholder="帳號 / 電子郵件" autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" formControlName="password" placeholder="密碼" autocomplete="current-password">
            </div>
          </div>

          @if (errorMessage) {
            <p class="error-message">{{ errorMessage }}</p>
          }

          <button type="submit" class="btn-primary" [disabled]="isLoading">
            {{ isLoading ? '登入中...' : '登入' }}
          </button>
        </form>

      </div>

      <!-- 頁尾宣告 -->
      <footer class="system-footer">
        Global Connect Corp. © 2026 | <a href="#">隱私權政策</a>
      </footer>
    </main>

  </div>

</div>
